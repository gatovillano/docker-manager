<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.2" />
    </linearGradient>

    <!-- Whale Gradient -->
    <linearGradient id="whale-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Container Gradients -->
    <linearGradient id="box-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="box-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="box-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Subtle Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="110" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="6" />

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="270" r="140" fill="#0284c7" opacity="0.18" filter="url(#glow)" />

  <g transform="translate(16, 25)">
    <!-- Containers Grid on Whale's Back -->
    <!-- Row 1 (Top) -->
    <rect x="186" y="112" width="46" height="38" rx="6" fill="url(#box-grad-1)" />

    <!-- Row 2 (Middle) -->
    <rect x="132" y="158" width="46" height="38" rx="6" fill="url(#box-grad-2)" />
    <rect x="186" y="158" width="46" height="38" rx="6" fill="url(#box-grad-1)" />
    <rect x="240" y="158" width="46" height="38" rx="6" fill="url(#box-grad-3)" />

    <!-- Row 3 (Bottom Containers) -->
    <rect x="78" y="204" width="46" height="38" rx="6" fill="url(#box-grad-3)" />
    <rect x="132" y="204" width="46" height="38" rx="6" fill="url(#box-grad-1)" />
    <rect x="186" y="204" width="46" height="38" rx="6" fill="url(#box-grad-2)" />
    <rect x="240" y="204" width="46" height="38" rx="6" fill="url(#box-grad-1)" />
    <rect x="294" y="204" width="46" height="38" rx="6" fill="url(#box-grad-2)" />

    <!-- Docker Whale Body -->
    <path d="M 436 262
             C 418 244 388 238 360 250
             C 346 256 338 250 338 248
             L 64 248
             C 58 248 54 254 56 260
             C 62 300 84 350 144 382
             C 216 418 336 414 394 352
             C 426 318 436 280 436 262 Z"
          fill="url(#whale-grad)" />

    <!-- Whale Eye -->
    <circle cx="370" cy="286" r="6" fill="#090d16" />

    <!-- Whale Tail -->
    <path d="M 64 250
             C 42 232 18 224 8 226
             C 4 227 4 233 8 236
             C 24 248 38 266 48 290
             C 52 298 62 294 62 284
             Z"
          fill="url(#whale-grad)" />

    <!-- Water Waves beneath -->
    <path d="M 60 410 C 110 395 160 425 210 410 C 260 395 310 425 360 410 C 400 398 430 414 450 410"
          fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" opacity="0.4" />
  </g>
</svg>
